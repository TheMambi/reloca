<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Harborline Lofts</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ApartmentComplex",
  "name": "Harborline Lofts",
  "url": "https://example.test/harborline",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "200 Sample Avenue",
    "addressLocality": "Long Beach",
    "addressRegion": "CA",
    "postalCode": "90802"
  },
  "numberOfRooms": 1,
  "numberOfBathroomsTotal": 1,
  "floorSize": { "@type": "QuantitativeValue", "value": 720, "unitCode": "FTK" },
  "petsAllowed": true,
  "amenityFeature": [
    { "@type": "LocationFeatureSpecification", "name": "In-unit laundry" },
    { "@type": "LocationFeatureSpecification", "name": "Rooftop deck" },
    { "@type": "LocationFeatureSpecification", "name": "Bike room" }
  ],
  "offers": {
    "@type": "Offer",
    "priceCurrency": "USD",
    "priceSpecification": {
      "@type": "PriceSpecification",
      "minPrice": 2500,
      "maxPrice": 3200,
      "priceCurrency": "USD"
    }
  }
}
</script>
</head>
<body>
<h1>Harborline Lofts</h1>
<p>Modern lofts steps from the marina.</p>
</body>
</html>
